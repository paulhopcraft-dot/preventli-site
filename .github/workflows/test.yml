name: Test

# Until this existed, the only PR checks were the two Vercel deploys — which
# build the site but never run vitest. A broken `main` was therefore invisible
# to CI: /lmw shipped without its security-headers rule and the failing test
# (lib/security-headers.test.ts) went unnoticed until someone ran it locally.
#
# Runs on PRs, and on pushes to main so a merge result is verified even when it
# lands without a PR.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.x is Vercel's default for this project, so CI and the deploy
          # build agree on the runtime.
          node-version: 22.x
          cache: npm

      - run: npm ci

      # The suite is pure unit tests — no env vars, no secrets, no `next build`.
      - run: npm test
